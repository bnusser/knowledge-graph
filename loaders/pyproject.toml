[project]
name = "knowledge-graph-loaders"
version = "0.1.0"
description = "Streaming dataset loaders for the knowledge graph core API"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "responses>=0.25,<1",
]

[project.scripts]
elliptic-loader = "kg_loaders.elliptic_loader:main"
paysim-loader = "kg_loaders.paysim_loader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_loaders"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["-m", "not slow"]
markers = [
    "slow: opt-in large-scale dataset tests",
]
