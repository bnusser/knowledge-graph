openapi: 3.0.3
info:
  title: Knowledge Graph Core API
  version: 0.3.0
  description: >
    Entity/relationship CRUD, schema modeling, and bounded traversal API for the Java
    knowledge-graph core.
    Every request requires a valid X-API-Key header (Constitution Principle IV minimum
    interim auth bar, FR-016). OAuth2/JWT is a later, dedicated security slice.
servers:
  - url: http://localhost:8080
security:
  - ApiKeyAuth: []
paths:
  /entity-types:
    post:
      summary: Define a new entity type (schema)
      operationId: createEntityType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityTypeDefinition'
      responses:
        '201':
          description: Entity type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypeDefinition'
        '409':
          description: Entity type name already exists
    get:
      summary: List defined entity types
      operationId: listEntityTypes
      responses:
        '200':
          description: List of entity type definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityTypeDefinition'

  /relationship-types:
    post:
      summary: Define a new relationship type (schema)
      operationId: createRelationshipType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipTypeDefinition'
      responses:
        '201':
          description: Relationship type created
        '409':
          description: Relationship type name already exists
        '422':
          description: References an unknown entity type in allowedSourceTypes/allowedTargetTypes
    get:
      summary: List defined relationship types
      operationId: listRelationshipTypes
      responses:
        '200':
          description: List of relationship type definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelationshipTypeDefinition'

  /entities:
    post:
      summary: Create a new entity
      operationId: createEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityCreateRequest'
      responses:
        '201':
          description: Entity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '404':
          description: Referenced entity type does not exist
        '409':
          description: Duplicate entity for this type's identifying property
        '422':
          description: Schema validation failure (missing required property, wrong type)
    get:
      summary: List entities, optionally filtered by type
      operationId: listEntities
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'

  /entities/bulk:
    post:
      summary: Create multiple entities in one request
      operationId: createEntitiesBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkEntityCreateRequest'
      responses:
        '200':
          description: Per-item outcomes; invalid items do not prevent valid items from succeeding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'

  /entities/{entityId}:
    parameters:
      - name: entityId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Retrieve a single entity
      operationId: getEntity
      responses:
        '200':
          description: Entity found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '404':
          description: Entity not found
    patch:
      summary: Update an entity's properties
      operationId: updateEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityUpdateRequest'
      responses:
        '200':
          description: Entity updated
        '404':
          description: Entity not found
        '422':
          description: Schema validation failure
    delete:
      summary: Delete an entity
      operationId: deleteEntity
      parameters:
        - name: cascade
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Entity deleted
        '404':
          description: Entity not found
        '409':
          description: Entity has existing relationships and cascade was not requested

  /entities/{entityId}/relationships:
    parameters:
      - name: entityId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List relationships for an entity
      operationId: listEntityRelationships
      parameters:
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [incoming, outgoing, both]
            default: both
      responses:
        '200':
          description: List of relationships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relationship'

  /entities/{entityId}/neighborhood:
    get:
      summary: Explore a bounded neighborhood from an entity
      operationId: getEntityNeighborhood
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/MaxHops'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/RelationshipTypes'
        - $ref: '#/components/parameters/NeighborhoodLimit'
      responses:
        '200':
          description: Complete or explicitly truncated bounded neighborhood
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeighborhoodResult'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MissingEntity'
        '422':
          $ref: '#/components/responses/InvalidTraversal'

  /entities/{sourceEntityId}/shortest-path/{destinationEntityId}:
    get:
      summary: Find one deterministic shortest unweighted path
      operationId: getShortestPath
      parameters:
        - name: sourceEntityId
          in: path
          required: true
          schema:
            type: string
        - name: destinationEntityId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/MaxHops'
        - $ref: '#/components/parameters/Direction'
        - $ref: '#/components/parameters/RelationshipTypes'
      responses:
        '200':
          description: A complete shortest path or an explicit no-path outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortestPathResult'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MissingEntity'
        '422':
          $ref: '#/components/responses/InvalidTraversal'

  /relationships:
    post:
      summary: Create a new relationship between two existing entities
      operationId: createRelationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreateRequest'
      responses:
        '201':
          description: Relationship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '404':
          description: Source or target entity (or relationship type) does not exist
        '422':
          description: Schema validation failure (disallowed source/target type, property rules)

  /relationships/bulk:
    post:
      summary: Create multiple relationships in one request
      operationId: createRelationshipsBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRelationshipCreateRequest'
      responses:
        '200':
          description: Per-item outcomes; invalid items do not prevent valid items from succeeding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'

  /relationships/{relationshipId}:
    parameters:
      - name: relationshipId
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Update a relationship's properties
      operationId: updateRelationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipUpdateRequest'
      responses:
        '200':
          description: Relationship updated
        '404':
          description: Relationship not found
        '422':
          description: Schema validation failure
    delete:
      summary: Delete a relationship
      operationId: deleteRelationship
      responses:
        '204':
          description: Relationship deleted
        '404':
          description: Relationship not found

components:
  parameters:
    MaxHops:
      name: maxHops
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 10
        default: 3
    Direction:
      name: direction
      in: query
      required: false
      schema:
        type: string
        enum: [outgoing, incoming, both]
        default: both
    RelationshipTypes:
      name: relationshipTypes
      in: query
      required: false
      description: >
        Repeat to allow multiple schema-defined semantic relationship types. Omitted or empty
        means all types. A schema-defined type remains valid with no relationship instances.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
        default: []
    NeighborhoodLimit:
      name: limit
      in: query
      required: false
      description: Combined maximum of unique returned entities and relationships.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

  schemas:
    PropertyDefinition:
      type: object
      required: [name, dataType, required]
      properties:
        name:
          type: string
        dataType:
          type: string
          enum: [STRING, INTEGER, FLOAT, BOOLEAN, DATE]
        required:
          type: boolean

    EntityTypeDefinition:
      type: object
      required: [name, properties, identifyingProperty]
      properties:
        name:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/PropertyDefinition'
        identifyingProperty:
          type: string

    RelationshipTypeDefinition:
      type: object
      required: [name, allowedSourceTypes, allowedTargetTypes, properties]
      properties:
        name:
          type: string
        allowedSourceTypes:
          type: array
          items:
            type: string
        allowedTargetTypes:
          type: array
          items:
            type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/PropertyDefinition'

    Entity:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        properties:
          type: object
          additionalProperties: true

    EntityCreateRequest:
      type: object
      required: [type, properties]
      properties:
        type:
          type: string
        properties:
          type: object
          additionalProperties: true

    BulkEntityCreateRequest:
      type: object
      required: [items]
      example:
        items:
          - type: Account
            properties: {name: C1231006815, dataset: paysim}
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityCreateRequest'

    EntityUpdateRequest:
      type: object
      required: [properties]
      properties:
        properties:
          type: object
          additionalProperties: true

    Relationship:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        sourceEntityId:
          type: string
        targetEntityId:
          type: string
        properties:
          type: object
          additionalProperties: true

    RelationshipCreateRequest:
      type: object
      required: [type, sourceEntityId, targetEntityId]
      properties:
        type:
          type: string
        sourceEntityId:
          type: string
        targetEntityId:
          type: string
        properties:
          type: object
          additionalProperties: true

    BulkRelationshipCreateRequest:
      type: object
      required: [items]
      example:
        items:
          - type: TRANSACTION
            sourceEntityId: account-source-id
            targetEntityId: account-target-id
            properties: {step: 1, transactionType: TRANSFER, amount: 181.0, dataset: paysim}
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipCreateRequest'

    BulkItemResult:
      type: object
      required: [index, status]
      properties:
        index:
          type: integer
          description: Zero-based position in the submitted items array
        status:
          type: string
          enum: [created, already_present, rejected]
        id:
          type: string
          nullable: true
        error:
          type: string
          nullable: true

    BulkResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkItemResult'

    RelationshipUpdateRequest:
      type: object
      required: [properties]
      properties:
        properties:
          type: object
          additionalProperties: true

    TraversalDirection:
      type: string
      enum: [outgoing, incoming, both]

    TraversalEntity:
      type: object
      required: [id, type, properties]
      properties:
        id:
          type: string
        type:
          type: string
        properties:
          type: object
          additionalProperties: true

    TraversalRelationship:
      type: object
      required: [id, type, sourceEntityId, targetEntityId, properties]
      properties:
        id:
          type: string
        type:
          type: string
        sourceEntityId:
          type: string
        targetEntityId:
          type: string
        properties:
          type: object
          additionalProperties: true

    TraversedEntity:
      allOf:
        - $ref: '#/components/schemas/TraversalEntity'
        - type: object
          required: [distance]
          properties:
            distance:
              type: integer
              minimum: 0

    TraversedRelationship:
      allOf:
        - $ref: '#/components/schemas/TraversalRelationship'
        - type: object
          required: [encounteredAtHop]
          properties:
            encounteredAtHop:
              type: integer
              minimum: 1
              maximum: 10

    NeighborhoodResult:
      type: object
      required: [startEntityId, maxHops, direction, relationshipTypes, limit, resultSize, truncated, entities, relationships]
      properties:
        startEntityId:
          type: string
        maxHops:
          type: integer
        direction:
          $ref: '#/components/schemas/TraversalDirection'
        relationshipTypes:
          type: array
          items:
            type: string
        limit:
          type: integer
        resultSize:
          type: integer
          minimum: 1
        truncated:
          type: boolean
        entities:
          type: array
          items:
            $ref: '#/components/schemas/TraversedEntity'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/TraversedRelationship'

    PathOutcome:
      type: string
      enum: [found, no_path]

    ShortestPathResult:
      type: object
      required: [sourceEntityId, destinationEntityId, maxHops, direction, relationshipTypes, outcome, hopCount, entities, relationships]
      properties:
        sourceEntityId:
          type: string
        destinationEntityId:
          type: string
        maxHops:
          type: integer
        direction:
          $ref: '#/components/schemas/TraversalDirection'
        relationshipTypes:
          type: array
          items:
            type: string
        outcome:
          $ref: '#/components/schemas/PathOutcome'
        hopCount:
          type: integer
          minimum: 0
          maximum: 10
          nullable: true
        entities:
          type: array
          items:
            $ref: '#/components/schemas/TraversalEntity'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/TraversalRelationship'

    Error:
      type: object
      required: [timestamp, status, error]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string

  responses:
    MalformedRequest:
      description: A query value could not be parsed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid X-API-Key header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MissingEntity:
      description: Start, source, or destination entity does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidTraversal:
      description: Invalid bound, direction, or undefined relationship type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
