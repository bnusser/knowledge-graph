services:
  neo4j:
    image: neo4j:5.24
    container_name: kg-neo4j
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    environment:
      - NEO4J_AUTH=neo4j/local-dev-password
      - NEO4J_server_memory_pagecache_size=2G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - kg-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  java-core:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      APP_SECURITY_API_KEY: ${APP_SECURITY_API_KEY:-local-dev-key}
      SERVER_ADDRESS: 0.0.0.0
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: local-dev-password
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  kg-neo4j-data:
